# Applies supabase/migrations to the remote Supabase project.
# Manual only: launching it with mode "apply" IS the explicit go-ahead for `supabase db push`.
#
# Required repository secrets:
#   SUPABASE_ACCESS_TOKEN  (supabase.com → Account → Access Tokens)
#   SUPABASE_DB_PASSWORD   (database password chosen when creating the project)
#   SUPABASE_PROJECT_REF   (the <ref> in https://<ref>.supabase.co)
name: Supabase db push

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run = show pending migrations only, apply = push them"
        type: choice
        options: [dry-run, apply]
        default: dry-run

concurrency:
  group: supabase-db-push
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Dry run
        if: inputs.mode == 'dry-run'
        run: supabase db push --dry-run

      - name: Push migrations
        if: inputs.mode == 'apply'
        run: supabase db push

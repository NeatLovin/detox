# Applies supabase/migrations to the remote Supabase project.
# Manual only: launching it with mode "apply" IS the explicit go-ahead for `supabase db push`.
#
# Required repository secrets:
#   SUPABASE_ACCESS_TOKEN  (supabase.com → Account → Access Tokens)
#   SUPABASE_DB_PASSWORD   (database password chosen when creating the project)
#   SUPABASE_PROJECT_REF   (the <ref> in https://<ref>.supabase.co)
name: Supabase db push

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run = show pending migrations only, apply = push them"
        type: choice
        options: [dry-run, apply, verify, auth-logs, auth-config, deploy-push, push-log]
        default: dry-run

concurrency:
  group: supabase-db-push
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v5

      - name: Check secrets
        run: |
          missing=0
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF; do
            if [ -z "${!name}" ]; then echo "::error::Missing secret $name"; missing=1; fi
          done
          if [ "$missing" = 0 ] && ! [[ "$SUPABASE_PROJECT_REF" =~ ^[a-z]{20}$ ]]; then
            echo "::error::SUPABASE_PROJECT_REF must be the 20-letter ref only (not the full URL)"; missing=1
          fi
          exit $missing

      - name: Auth logs, last 2 hours (read-only)
        if: inputs.mode == 'auth-logs'
        run: |
          sql="select timestamp, event_message from auth_logs order by timestamp desc limit 25"
          start=$(date -u -d '-2 hours' +%Y-%m-%dT%H:%M:%SZ)
          end=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          curl -sS -G "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/analytics/endpoints/logs.all" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --data-urlencode "sql=$sql" \
            --data-urlencode "iso_timestamp_start=$start" \
            --data-urlencode "iso_timestamp_end=$end" > logs.json
          jq -r '.error // empty' logs.json | while IFS= read -r e; do echo "::error::logs api: $e"; done
          # Keep only error-ish entries, then the most recent ones; emails are masked.
          jq -r '.result[]?.event_message' logs.json \
            | jq -rR 'fromjson? // {msg: .} | [(.level // ""), (.status // ""), (.path // ""), (.msg // ""), (.error // "")] | map(tostring) | join(" | ")' \
            | sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+/<email>/g' \
            | grep -iE 'error|fail|smtp|5[0-9][0-9]|mail' | head -10 \
            | while IFS= read -r line; do echo "::notice::${line:0:400}"; done || true
          echo "::notice::entries fetched: $(jq '.result | length' logs.json 2>/dev/null)"
          exit 0

      - name: Auth email config (read-only, password never shown)
        if: inputs.mode == 'auth-config'
        run: |
          curl -sS "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" > auth.json
          jq -r '.message // empty' auth.json | while IFS= read -r e; do echo "::error::config api: $e"; done
          mask() { sed -E 's/^(.{3})[^@]*@/\1***@/'; }
          echo "::notice::smtp host=$(jq -r '.smtp_host // "-"' auth.json) port=$(jq -r '.smtp_port // "-"' auth.json)"
          echo "::notice::smtp user=$(jq -r '.smtp_user // "-"' auth.json | mask) sender=$(jq -r '.smtp_admin_email // "-"' auth.json | mask) name=$(jq -r '.smtp_sender_name // "-"' auth.json)"
          echo "::notice::smtp password set=$(jq -r 'if (.smtp_pass // "") == "" then "no" else "yes" end' auth.json) | user==sender: $(jq -r 'if .smtp_user == .smtp_admin_email then "yes" else "no" end' auth.json)"
          echo "::notice::smtp password shape: $(jq -r '(.smtp_pass // "") as $p | if ($p | test("^[*•]+$")) then "masked by API" else "len=\($p | length) spaces=\($p | test(" ")) lowercase-only=\($p | test("^[a-z ]+$"))" end' auth.json)"
          echo "::notice::otp length=$(jq -r '.mailer_otp_length // "-"' auth.json) | email rate/h=$(jq -r '.rate_limit_email_sent // "-"' auth.json)"
          for t in confirmation magic_link; do
            has=$(jq -r --arg k "mailer_templates_${t}_content" 'if ((.[$k] // "") | test("\\.Token\\b")) then "yes" else "no" end' auth.json)
            echo "::notice::template $t contains {{ .Token }}: $has"
          done
          exit 0

      - uses: supabase/setup-cli@v1
        if: inputs.mode != 'auth-logs' && inputs.mode != 'auth-config'
        with:
          version: latest

      - name: Link project
        if: inputs.mode != 'auth-logs' && inputs.mode != 'auth-config'
        run: |
          if ! supabase link --project-ref "$SUPABASE_PROJECT_REF" > link.log 2>&1; then
            cat link.log
            echo "::error::supabase link failed: $(grep -v '^\s*$' link.log | tail -1)"
            exit 1
          fi
          cat link.log

      - name: Dry run
        if: inputs.mode == 'dry-run'
        run: |
          set -o pipefail
          supabase db push --dry-run 2>&1 | tee dry-run.log
          # Surface the pending migrations as annotations (readable without the raw log).
          grep -oE '[0-9]{14}_[A-Za-z0-9_]+\.sql' dry-run.log | sort -u | while read -r f; do
            echo "::notice::Pending migration: $f"
          done || true
          # Raw CLI output as annotations (last 8 non-empty lines).
          grep -v '^\s*$' dry-run.log | tail -8 | while IFS= read -r line; do
            echo "::notice::cli: $line"
          done || true

      - name: Verify remote state (read-only)
        if: inputs.mode == 'verify'
        run: |
          supabase migration list --linked 2>&1 | tee list.log || true
          grep -E '^\s*[0-9]{14}' list.log | while IFS= read -r line; do
            echo "::notice::migration: $(echo "$line" | tr -s ' ')"
          done || true
          q() {
            out=$(supabase db query --linked --output csv "$1" 2>&1) || true
            echo "$out"
            echo "::notice::$2: $(echo "$out" | tail -n +2 | tr '\n' ' ' | cut -c1-300)"
          }
          q "select count(*) from information_schema.tables where table_schema='public'" "public tables"
          q "select jobname || ' ' || schedule from cron.job" "cron jobs"
          q "select tablename from pg_publication_tables where pubname='supabase_realtime'" "realtime tables"
          q "select count(*) from public.profiles" "profiles"
          q "select string_agg(version, ' ' order by version) from supabase_migrations.schema_migrations" "applied migrations"
          q "select (position('ceil(' in prosrc) > 0)::text from pg_proc where proname = 'on_relapse_insert'" "relapse uses ceil"
          q "select string_agg(tablename, ' ' order by tablename) from pg_tables where schemaname='public'" "tables"
          q "select string_agg(proname, ' ' order by proname) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and proname in ('leaderboard','player_profile','start_sos','log_quest','make_pledge','create_squad')" "rpcs"
          q "select string_agg(tablename, ' ' order by tablename) from pg_publication_tables where pubname='supabase_realtime'" "realtime"
          q "select count(*) || ' rules' from private.reward_rules" "reward rules"
          q "select count(*) || ' releases' from public.app_releases" "app releases"
          q "select (select count(*) from private.push_config) || ' config, pg_net=' || exists(select 1 from pg_extension where extname='pg_net')::text" "push"
          q "select string_agg(jobname, ' ') from cron.job" "cron"
          q "select coalesce(string_agg(id || ':' || public::text, ' '), 'none') from storage.buckets" "buckets"

      # Deploys the push Edge Function and points the database at it. The
      # shared secret is derived from the DB password (stable, never printed).
      - name: Deploy push function
        if: inputs.mode == 'deploy-push'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then echo "::error::Missing secret FIREBASE_SERVICE_ACCOUNT"; exit 1; fi
          if ! printf '%s' "$FIREBASE_SERVICE_ACCOUNT" | jq -e '.project_id and .client_email and .private_key' > /dev/null; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT is not a service account JSON key"; exit 1
          fi
          echo "::notice::Firebase project: $(printf '%s' "$FIREBASE_SERVICE_ACCOUNT" | jq -r .project_id)"
          secret=$(printf '%s' "detox-push:$SUPABASE_DB_PASSWORD" | sha256sum | cut -d' ' -f1)
          echo "::add-mask::$secret"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > sa.json
          supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" \
            "FIREBASE_SERVICE_ACCOUNT=$(cat sa.json)" "PUSH_SECRET=$secret" > /dev/null
          rm -f sa.json
          supabase functions deploy push --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          url="https://$SUPABASE_PROJECT_REF.supabase.co/functions/v1/push"
          supabase db query --linked "insert into private.push_config (id, function_url, secret) values (1, '$url', '$secret') on conflict (id) do update set function_url = excluded.function_url, secret = excluded.secret" > /dev/null
          code=$(curl -sS -o resp.txt -w '%{http_code}' -X POST "$url" -H "x-push-secret: $secret" \
            -H "Content-Type: application/json" -d '{"user_ids":[],"title":""}')
          echo "::notice::push function answered $code: $(head -c 100 resp.txt)"
          [ "$code" = 200 ] || exit 1

      - name: Push log (read-only)
        if: inputs.mode == 'push-log'
        run: |
          q() {
            out=$(supabase db query --linked --output csv "$1" 2>&1) || true
            echo "::notice::$2: $(echo "$out" | tail -n +2 | tr '\n' ' ' | cut -c1-400)"
          }
          q "select count(*) || ' devices / ' || count(distinct user_id) || ' players' from public.push_tokens" "tokens"
          q "select string_agg(kind || '@' || to_char(created_at at time zone 'Europe/Zurich', 'DD HH24:MI') || ' to=' || cardinality(user_ids) || ' sent=' || sent, ' | ' order by created_at desc) from (select * from private.push_log order by created_at desc limit 8) l" "last pushes"
          q "select coalesce(string_agg(status_code::text, ' '), 'none') from (select status_code from net._http_response order by created desc limit 8) r" "pg_net responses"
          q "select coalesce(string_agg(left(content, 80), ' | '), 'none') from (select content from net._http_response order by created desc limit 3) r" "function answers"

      - name: Push migrations
        if: inputs.mode == 'apply'
        run: |
          set -o pipefail
          supabase db push 2>&1 | tee push.log
          grep -oE '[0-9]{14}_[A-Za-z0-9_]+\.sql' push.log | sort -u | while read -r f; do
            echo "::notice::Applied migration: $f"
          done

# Fast feedback without building an APK: analyzer, Dart tests and SQL tests.
# Runs on every branch except main (main runs the full APK workflow) and on PRs.
name: Checks

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dart:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: flutter pub get
        run: |
          set -o pipefail
          if ! flutter pub get 2>&1 | tee pub.log; then
            grep -iE 'error|because|incompatible|requires|version solving|depends on|sdk' pub.log | head -15 | while IFS= read -r l; do echo "::error::${l:0:300}"; done
            exit 1
          fi

      # Generated files (riverpod, freezed, json, l10n) are produced here and
      # committed back to the branch, so authoring without a local SDK works.
      - name: Codegen (committed back to the branch)
        run: |
          set -o pipefail
          if ! dart run build_runner build -d 2>&1 | tee codegen.log; then
            grep -E 'SEVERE|error' codegen.log | head -10 | while IFS= read -r l; do echo "::error::${l:0:300}"; done
            exit 1
          fi
          flutter gen-l10n
          if [ -n "$(git status --porcelain -- lib test pubspec.lock)" ] && [ "${{ github.event_name }}" = "push" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib test pubspec.lock
            git commit -m "chore: regenerate code"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "::notice::Generated files committed back to ${GITHUB_REF_NAME}"
          fi

      - name: Analyze
        run: |
          set -o pipefail
          if ! flutter analyze --no-fatal-infos 2>&1 | tee analyze.log; then
            grep -E '^\s*(error|warning) •' analyze.log | head -20 | while IFS= read -r l; do
              echo "::error::$(echo "$l" | tr -s ' ')"
            done
            exit 1
          fi

      - name: Riverpod lint
        run: |
          set -o pipefail
          if ! dart analyze 2>&1 | tee dart-analyze.log; then
            grep -v '^\s*$' dart-analyze.log | grep -v '^\s*info' | tail -15 | while IFS= read -r l; do
              echo "::error::$(echo "$l" | tr -s ' ' | cut -c1-300)"
            done
            exit 1
          fi

      - name: Tests
        run: |
          set -o pipefail
          if ! flutter test --reporter expanded 2>&1 | tee test.log; then
            grep -nE '\[E\]|Error:|Expected:|Actual:|Which:' test.log | head -20 | while IFS= read -r l; do
              echo "::error::${l:0:300}"
            done
            exit 1
          fi

  sql:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - name: SQL tests
        env:
          PGHOST: localhost
          PGUSER: postgres
        run: |
          set -o pipefail
          if ! tool/sql_tests/run.sh 2>&1 | tee sql.log; then
            grep -E 'ERROR|FAIL' sql.log | head -10 | while IFS= read -r l; do echo "::error::${l:0:300}"; done
            exit 1
          fi

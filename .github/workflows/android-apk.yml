# Builds a signed release APK on every push to main (or on demand) and publishes it
# as a GitHub Release, so it can be downloaded straight from a phone.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL, SUPABASE_ANON_KEY
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
name: Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'supabase/**'
      - 'tool/**'
      - '.github/workflows/supabase-db-push.yml'
      - 'docs/**'
      - 'test/screenshots/**'
      - '.github/workflows/screenshots.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the release and the in-app update (off = build check only)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Check secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for name in SUPABASE_URL SUPABASE_ANON_KEY KEYSTORE STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::Missing secret for $name"; missing=1; fi
          done
          [ "$missing" = 0 ] || exit 1
          # Format checks (the values themselves are never printed).
          url="$(printf '%s' "$SUPABASE_URL" | tr -d '[:space:]')"
          key="$(printf '%s' "$SUPABASE_ANON_KEY" | tr -d '[:space:]')"
          [ "$url" != "$SUPABASE_URL" ] && echo "::warning::SUPABASE_URL contains whitespace (trimmed by the app)"
          [ "$key" != "$SUPABASE_ANON_KEY" ] && echo "::warning::SUPABASE_ANON_KEY contains whitespace (trimmed by the app)"
          if ! [[ "$url" =~ ^https://[a-z0-9]{20}\.supabase\.co/?$ ]]; then
            echo "::error::SUPABASE_URL must look like https://<20-char-ref>.supabase.co (got ${#url} chars, starts with '${url:0:12}')"; missing=1
          fi
          case "$key" in
            sb_secret_*) echo "::error::SUPABASE_ANON_KEY is a SECRET key: use the publishable key"; missing=1 ;;
            sb_publishable_*|eyJ*) echo "::notice::SUPABASE_ANON_KEY format OK (${key:0:15}…, ${#key} chars)" ;;
            *) echo "::error::SUPABASE_ANON_KEY must start with sb_publishable_ or eyJ (got ${#key} chars, starts with '${key:0:4}')"; missing=1 ;;
          esac
          exit $missing

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Write env.json and signing config
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          jq -n --arg url "$SUPABASE_URL" --arg key "$SUPABASE_ANON_KEY" \
            '{SUPABASE_URL: $url, SUPABASE_ANON_KEY: $key}' > env.json
          echo "$KEYSTORE" | base64 --decode > android/app/upload.jks
          {
            echo "storeFile=upload.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: flutter pub get
        run: |
          set -o pipefail
          if ! flutter pub get 2>&1 | tee pub.log; then
            grep -v '^\s*$' pub.log | tail -12 | while IFS= read -r l; do echo "::error::${l:0:300}"; done
            exit 1
          fi

      - name: Analyze
        run: |
          set -o pipefail
          if ! flutter analyze --no-fatal-infos 2>&1 | tee analyze.log; then
            # Surface analyzer errors as annotations (raw logs are not always reachable).
            grep -E '^\s*(error|warning) •' analyze.log | head -10 | while IFS= read -r l; do
              echo "::error::$(echo "$l" | tr -s ' ')"
            done
            exit 1
          fi

      - name: Tests
        run: |
          set -o pipefail
          if ! flutter test --reporter expanded 2>&1 | tee test.log; then
            grep -E '\[E\]|Error:|Expected:|Actual:' test.log | head -10 | while IFS= read -r l; do
              echo "::error::${l:0:300}"
            done
            exit 1
          fi

      - name: Build APK
        run: |
          flutter build apk --release \
            --dart-define-from-file=env.json \
            --dart-define=BUILD_NUMBER=${{ github.run_number }} \
            --build-number=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk detox-build-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: detox-apk
          path: detox-build-${{ github.run_number }}.apk
          retention-days: 14

      - name: Publish release
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: build-${{ github.run_number }}
          APK: detox-build-${{ github.run_number }}.apk
        run: |
          cat > notes.md <<EOF
          APK Android de Detox, build ${{ github.run_number }} (commit ${GITHUB_SHA::7}).
          Sur ton téléphone : télécharge le fichier .apk ci-dessous, ouvre-le et autorise l'installation.
          Les mises à jour s'installent par-dessus l'ancienne version, sans perte de données.
          EOF
          if ! gh release create "$TAG" "$APK" --target "$GITHUB_SHA" \
               --title "Detox build ${{ github.run_number }}" --notes-file notes.md --latest > release.log 2>&1; then
            cat release.log
            echo "::error::Release failed: $(grep -v '^\s*$' release.log | tail -1)"
            echo "::error::Fallback: download the APK from this run's Artifacts (detox-apk)."
            exit 1
          fi
          echo "::notice::Release published: $(tail -1 release.log)"

      # In-app updates: an arm64-only APK (≈25 MB, under the 50 MB storage limit
      # of the free plan) with the SAME version code as the full APK, so either
      # one installs over the other.
      - name: Build arm64 APK (in-app update)
        run: |
          flutter build apk --release --target-platform android-arm64 \
            --dart-define-from-file=env.json \
            --dart-define=BUILD_NUMBER=${{ github.run_number }} \
            --build-number=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk detox-arm64-${{ github.run_number }}.apk
          echo "::notice::arm64 APK: $(du -h detox-arm64-${{ github.run_number }}.apk | cut -f1)"

      - name: Publish in-app update (Supabase)
        if: github.event_name == 'push' || inputs.publish
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          BUILD: ${{ github.run_number }}
        run: |
          set -euo pipefail
          url="$(printf '%s' "$SUPABASE_URL" | tr -d '[:space:]' | sed 's:/*$::')"
          # The service key is fetched at run time with the management token and
          # never stored: it only lives in this step.
          key=$(curl -sS "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/api-keys?reveal=true" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            | jq -r '[.[] | select(.name == "service_role" or .type == "secret") | .api_key | select(. != null and . != "")][0] // empty')
          if [ -z "$key" ]; then echo "::error::Could not fetch the service key"; exit 1; fi
          echo "::add-mask::$key"

          file="detox-arm64-$BUILD.apk"
          code=$(curl -sS -o upload.json -w '%{http_code}' -X POST "$url/storage/v1/object/releases/$file" \
            -H "Authorization: Bearer $key" -H "apikey: $key" \
            -H "Content-Type: application/vnd.android.package-archive" -H "x-upsert: true" \
            --data-binary "@$file")
          if [ "$code" -ge 300 ]; then echo "::error::Upload failed ($code): $(head -c 300 upload.json)"; exit 1; fi

          notes=$(git log -1 --format=%s | head -c 200)
          jq -n --argjson v "$BUILD" --arg name "build $BUILD" \
            --arg apk "$url/storage/v1/object/public/releases/$file" --arg notes "$notes" \
            '{version_code: $v, version_name: $name, apk_url: $apk, notes: $notes}' > release.json
          code=$(curl -sS -o insert.json -w '%{http_code}' -X POST "$url/rest/v1/app_releases" \
            -H "Authorization: Bearer $key" -H "apikey: $key" -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates" --data-binary @release.json)
          if [ "$code" -ge 300 ]; then echo "::error::Release row failed ($code): $(head -c 300 insert.json)"; exit 1; fi
          echo "::notice::In-app update published: build $BUILD"

      - name: Clean up signing files
        if: always()
        run: rm -f android/app/upload.jks android/key.properties env.json

# Builds a signed release APK on every push to main (or on demand) and publishes it
# as a GitHub Release, so it can be downloaded straight from a phone.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL, SUPABASE_ANON_KEY
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
name: Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'supabase/**'
      - 'tool/**'
      - '.github/workflows/supabase-db-push.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Check secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for name in SUPABASE_URL SUPABASE_ANON_KEY KEYSTORE STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::Missing secret for $name"; missing=1; fi
          done
          [ "$missing" = 0 ] || exit 1
          # Format checks (the values themselves are never printed).
          url="$(printf '%s' "$SUPABASE_URL" | tr -d '[:space:]')"
          key="$(printf '%s' "$SUPABASE_ANON_KEY" | tr -d '[:space:]')"
          [ "$url" != "$SUPABASE_URL" ] && echo "::warning::SUPABASE_URL contains whitespace (trimmed by the app)"
          [ "$key" != "$SUPABASE_ANON_KEY" ] && echo "::warning::SUPABASE_ANON_KEY contains whitespace (trimmed by the app)"
          if ! [[ "$url" =~ ^https://[a-z0-9]{20}\.supabase\.co/?$ ]]; then
            echo "::error::SUPABASE_URL must look like https://<20-char-ref>.supabase.co (got ${#url} chars, starts with '${url:0:12}')"; missing=1
          fi
          case "$key" in
            sb_secret_*) echo "::error::SUPABASE_ANON_KEY is a SECRET key: use the publishable key"; missing=1 ;;
            sb_publishable_*|eyJ*) echo "::notice::SUPABASE_ANON_KEY format OK (${key:0:15}…, ${#key} chars)" ;;
            *) echo "::error::SUPABASE_ANON_KEY must start with sb_publishable_ or eyJ (got ${#key} chars, starts with '${key:0:4}')"; missing=1 ;;
          esac
          exit $missing

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Write env.json and signing config
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          jq -n --arg url "$SUPABASE_URL" --arg key "$SUPABASE_ANON_KEY" \
            '{SUPABASE_URL: $url, SUPABASE_ANON_KEY: $key}' > env.json
          echo "$KEYSTORE" | base64 --decode > android/app/upload.jks
          {
            echo "storeFile=upload.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - run: flutter pub get

      - name: Analyze
        run: |
          set -o pipefail
          if ! flutter analyze --no-fatal-infos 2>&1 | tee analyze.log; then
            # Surface analyzer errors as annotations (raw logs are not always reachable).
            grep -E '^\s*(error|warning) •' analyze.log | head -10 | while IFS= read -r l; do
              echo "::error::$(echo "$l" | tr -s ' ')"
            done
            exit 1
          fi

      - name: Tests
        run: |
          set -o pipefail
          if ! flutter test --reporter expanded 2>&1 | tee test.log; then
            grep -E '\[E\]|Error:|Expected:|Actual:' test.log | head -10 | while IFS= read -r l; do
              echo "::error::${l:0:300}"
            done
            exit 1
          fi

      - name: Build APK
        run: |
          flutter build apk --release \
            --dart-define-from-file=env.json \
            --build-number=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk detox-build-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: detox-apk
          path: detox-build-${{ github.run_number }}.apk
          retention-days: 14

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: build-${{ github.run_number }}
          APK: detox-build-${{ github.run_number }}.apk
        run: |
          cat > notes.md <<EOF
          APK Android de Detox, build ${{ github.run_number }} (commit ${GITHUB_SHA::7}).
          Sur ton téléphone : télécharge le fichier .apk ci-dessous, ouvre-le et autorise l'installation.
          Les mises à jour s'installent par-dessus l'ancienne version, sans perte de données.
          EOF
          if ! gh release create "$TAG" "$APK" --target "$GITHUB_SHA" \
               --title "Detox build ${{ github.run_number }}" --notes-file notes.md --latest > release.log 2>&1; then
            cat release.log
            echo "::error::Release failed: $(grep -v '^\s*$' release.log | tail -1)"
            echo "::error::Fallback: download the APK from this run's Artifacts (detox-apk)."
            exit 1
          fi
          echo "::notice::Release published: $(tail -1 release.log)"

      - name: Clean up signing files
        if: always()
        run: rm -f android/app/upload.jks android/key.properties env.json
